name: Generate Datas
on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Generate snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (SVG + GIF)
        uses: Platane/snk@v3
        with:
          github_user_name: Nikhilsingh7130
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

      - name: Upload artifacts for preview
        uses: actions/upload-artifact@v4
        with:
          name: github-contribution-grid-snake
          path: dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
